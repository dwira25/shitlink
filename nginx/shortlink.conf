# Self-Hosted Short Link — production Nginx site
# Place in /etc/nginx/sites-available/shortlink and symlink into sites-enabled.
# Domain: change server_name; ports 80+443 (443 config generated by certbot).
# Requires Node.js API running on 127.0.0.1:4000 (PM2: shortlink-backend).

server {
    listen 80;
    listen [::]:80;
    server_name go.domain.com;

    root /var/www/shortlink/frontend/dist;
    index index.html;

    client_max_body_size 2m;

    # --- security headers ---
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # --- gzip ---
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # --- Vue admin panel (SPA) ---
    location /admin {
        try_files $uri $uri/ /index.html;
    }

    # --- hashed assets: cache forever ---
    location /assets {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # --- REST API ---
    location /api {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- public short links: everything else goes to Node for the 302 ---
    # CRITICAL: do NOT replace this with try_files — /promo2026 must reach Node.
    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
